<body id="top" class="cert page-contact">
<!--
  THESIS: The page is the form, held in one hard-ruled grid. It refuses the
  centred card and the decorative split-screen hero.
  OWN-WORLD: Hard-ruled form grid on cool Kaleido paper. 1px rules in the page hue, zero
  radius, zero shadow, cells in #F1F7F9 on a #E5EEF2 ground. Space
  Mono only. This page's hue is slate blue #4A6A85, washing the invitation cell
  above the form and the direct-contact cell below it, so the form is framed
  in colour top and bottom.
  STORY: The visitor understands what Stefan takes on, files an enquiry in fields
  that read as a real document, or emails him directly.
  FIRST VIEWPORT: Header rail, the invitation at display scale, then the first
  ruled input cells already visible so the action is unmistakable.
  FORM: Hard-ruled grid system, taken from a certificate reference for its
  styling and structure only - big blocks, hard rules, mono type. Not a
  certificate, and it does not borrow certificate language.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->

  <div class="grain" aria-hidden="true"></div>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <nav class="cert-nav" aria-label="Primary">
    <div class="cert-nav-inner">
      <a class="cert-brand" href="/">
        <img src="assets/img/logo.png" alt="Stefan Carter, home" width="32" height="32">
      </a>
      <ul class="cert-nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/work">Work</a></li>
        <li><a href="/contact" aria-current="page">Contact</a></li>
      </ul>
    </div>
  </nav>

  <div class="cert-page">
    <main id="main-content" class="sheet sheet-in">

      <!-- Invitation -->
      <div class="crow row-full">
        <p class="vlabel">Contact</p>
        <div class="cell cell-hue cell-pad-lg cell-mid">
          <h1 class="c-hero">Let&rsquo;s talk.</h1>
          <p class="c-body cs-3">
            New project, redesign or a second opinion. I&rsquo;m happy to chat.
          </p>
        </div>
      </div>

      <!-- The form posts to Formspree. REPLACE "your-form-id" BELOW WITH A REAL
           FORM ID FROM formspree.io/forms BEFORE THIS GOES LIVE - it is still
           the documentation placeholder, so submissions currently go nowhere.
           js/main.js intercepts the submit when JS is available and reports
           success or failure in #cf-status; without JS the plain POST still
           reaches Formspree and Formspree's own confirmation page is shown.
           Until a real ID is set, the mailto link below is the only working
           route. -->
      <form class="cert-form" id="contactForm" action="https://formspree.io/f/your-form-id" method="POST">
        <div class="form-stack">

          <div class="form-field">
            <label class="form-label" for="cf-name">Name</label>
            <input class="form-control" type="text" id="cf-name" name="name" autocomplete="name" required>
          </div>

          <div class="form-field">
            <label class="form-label" for="cf-email">Email</label>
            <input class="form-control" type="email" id="cf-email" name="email" autocomplete="email" required>
          </div>

          <div class="form-field">
            <label class="form-label" for="cf-message">Message</label>
            <textarea class="form-control" id="cf-message" name="message" rows="7" required></textarea>
          </div>

          <!-- Honeypot: hidden from sighted and screen-reader users, invisible
               to humans, filled in by most simple bots. Formspree drops any
               submission where this is non-empty. -->
          <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" class="visually-hidden" aria-hidden="true">

          <button class="c-btn c-btn-block" type="submit">Send message</button>

          <!-- After the button: the outcome reads under the action that
               caused it, and while empty its flex gap falls into the form's
               bottom padding instead of opening a hole above the button. -->
          <p class="form-note" id="cf-status" role="status" aria-live="polite"></p>

        </div>
      </form>

      <!-- Close -->
      <div class="crow row-full cert-foot">
        <p class="vlabel">Direct</p>
        <div class="cell cell-pad-lg">
          <p class="c-meta mb-label">Prefer email?</p>
          <a class="cert-mail" href="mailto:carter_stefan@outlook.com">carter_stefan@outlook.com</a>
        </div>
      </div>

      <div class="crow row-aside-right">
        <div class="cell" aria-hidden="true"></div>
        <div class="cell cell-tight">
          <p class="c-meta">&copy; <span id="year">2026</span> Stefan Carter</p>
        </div>
        <div class="cell cell-tight text-end">
          <a class="c-link" href="#top">Back to top <svg class="c-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="20" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></a>
        </div>
      </div>

    </main>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
